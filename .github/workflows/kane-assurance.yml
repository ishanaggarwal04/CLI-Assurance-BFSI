name: Kane CLI Assurance — Bank Demo (BFSI)

# Runs the *_test.md files already authored under .testmuai/tests with kane-cli.
# This does NOT do PRD ingestion / test design — it assumes the test.md files
# are already written (by you, or by `kane-cli generate` / assurance design run
# locally) and committed to the repo. Two ways in:
#
#   1. push — whenever a commit that touches .testmuai/tests/**/*_test.md lands
#      on main, the pipeline automatically runs just the test.md files that
#      commit added or changed.
#   2. workflow_dispatch — run by hand, with `scope` choosing what to execute:
#        - changed: same diff-based selection as the push trigger, computed
#          against the previous commit on the ref you run this from
#        - all: every *_test.md under .testmuai/tests
#        - select: exactly the files you list in `test_files`
#
# Evidence packs (.testmuai/evidence/*.evidence), the generated automation
# code + Result.md for each test (.testmuai/tests/output-*/**), and a
# per-test pass/fail summary are all uploaded as workflow artifacts on every
# run (even on failure), AND committed to a dedicated `test-results` branch
# (kept separate from main so results never pollute the source history) —
# browse it directly at:
#   <repo>/tree/test-results/latest   — this run's results
#   <repo>/tree/test-results/runs     — history of past runs (last 30 kept)
on:
  push:
    branches: [main]
    paths:
      - ".testmuai/tests/**/*_test.md"
  workflow_dispatch:
    inputs:
      scope:
        description: "Which tests to run"
        required: true
        default: "changed"
        type: choice
        options:
          - changed
          - all
          - select
      test_files:
        description: "Only used when scope=select. Comma- or newline-separated *_test.md paths, relative to repo root."
        required: false
        default: ""
      login_url:
        description: "Optional override for login_url/base_url in kane-variables.seed.json. Leave blank to use the seed file as-is."
        required: false
        default: ""
      shard_count:
        description: "Number of parallel GitHub Actions runners to fan the selected tests across"
        required: false
        default: "2"
      parallel_per_shard:
        description: "kane-cli testrun --parallel workers inside each shard runner"
        required: false
        default: "4"

env:
  KANE_CLI_VERSION: "@testmuai/kane-cli"   # pin e.g. @testmuai/kane-cli@0.7.2 once you've validated a release
  VARIABLES_SEED: "kane-variables.seed.json"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Work out which *_test.md files this run is responsible for, and stash
  #    that list as an artifact so every shard in the next job reads the same
  #    selection instead of recomputing it (and possibly disagreeing after a
  #    push lands mid-run).
  # ---------------------------------------------------------------------------
  select-tests:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shard-plan.outputs.shards }}
      has_tests: ${{ steps.list.outputs.has_tests }}
    env:
      SCOPE: ${{ inputs.scope || 'changed' }}
      TEST_FILES_INPUT: ${{ inputs.test_files || '' }}
      SHARD_COUNT: ${{ inputs.shard_count || '2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scope=changed needs history to diff against the previous commit

      - name: Resolve test scope
        id: list
        run: |
          set -euo pipefail
          mkdir -p .ci

          case "$SCOPE" in
            all)
              find .testmuai/tests -name '*_test.md' | sort > .ci/selected_tests.txt
              ;;

            select)
              printf '%s' "$TEST_FILES_INPUT" \
                | tr ',' '\n' \
                | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
                | grep -v '^$' \
                | sort -u > .ci/selected_tests.txt

              # Fail fast on typos rather than letting kane-cli error out per-shard.
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                if [[ "$f" != *_test.md ]] || [ ! -f "$f" ]; then
                  echo "::error::scope=select listed '$f', which is not an existing *_test.md file." >&2
                  exit 1
                fi
              done < .ci/selected_tests.txt
              ;;

            changed|*)
              if [ "${{ github.event_name }}" = "push" ]; then
                BASE="${{ github.event.before }}"
                HEAD="${{ github.event.after }}"
              else
                BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
                HEAD="HEAD"
              fi

              if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
                git diff --name-only --diff-filter=ACM "$BASE" "$HEAD" -- .testmuai/tests \
                  | grep -E '_test\.md$' | sort -u > .ci/selected_tests.txt || true
              else
                # New branch / no previous commit to diff (before = all-zero SHA,
                # or this is the repo's first commit) — fall back to every test.
                echo "No usable base commit for a diff — running every test.md instead."
                find .testmuai/tests -name '*_test.md' | sort > .ci/selected_tests.txt
              fi
              ;;
          esac

          echo "Resolved scope '$SCOPE':"
          cat .ci/selected_tests.txt || true

          if [ -s .ci/selected_tests.txt ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No *_test.md files matched — nothing to run this time."
          fi

      - uses: actions/upload-artifact@v4
        if: steps.list.outputs.has_tests == 'true'
        with:
          name: selected-tests
          path: .ci/selected_tests.txt

      - name: Compute shard plan
        id: shard-plan
        run: |
          echo "shards=$(jq -n -c '[range(0; ${{ env.SHARD_COUNT }})]')" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Fan the selected tests out across N runners (shard_count), and within
  #    each runner drive kane-cli testrun with its own --parallel worker pool.
  # ---------------------------------------------------------------------------
  run-tests:
    needs: select-tests
    if: needs.select-tests.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.select-tests.outputs.shards) }}
    env:
      SHARD_COUNT: ${{ inputs.shard_count || '2' }}
      PARALLEL_PER_SHARD: ${{ inputs.parallel_per_shard || '4' }}
      LOGIN_URL: ${{ inputs.login_url || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: browser-actions/setup-chrome@v1

      - name: Install Kane CLI
        run: npm install -g ${{ env.KANE_CLI_VERSION }}

      - name: Login (basic auth, non-interactive)
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"

      - uses: actions/download-artifact@v4
        with:
          name: selected-tests
          path: .ci

      # Builds .testmuai/variables/runtime.json, which kane-cli reads for every
      # {{placeholder}} in the tests. Sources, later wins:
      #   1. $VARIABLES_SEED (committed, non-sensitive values)
      #   2. env entries named KANE_VAR_<NAME>     -> {{name}}
      #   3. env entries named KANE_SECRET_<NAME>  -> {{name}}, secret: true (masked)
      #   4. the login_url workflow input (login_url + base_url)
      # Empty values are ignored, so an unset secret never blanks out a value.
      - name: Build run-time variables file
        # Map your GitHub secrets / variables to {{placeholders}} here, one line
        # each (see README → Credentials and test data). For example:
        #
        # env:
        #   KANE_SECRET_APP_USER: ${{ secrets.APP_USER }}           # -> {{app_user}}
        #   KANE_SECRET_APP_PASSWORD: ${{ secrets.APP_PASSWORD }}   # -> {{app_password}}
        #   KANE_VAR_LOGIN_URL: ${{ vars.LOGIN_URL }}               # -> {{login_url}}
        run: |
          set -euo pipefail
          mkdir -p .testmuai/variables
          SEED="$VARIABLES_SEED"
          [ -f "$SEED" ] || SEED=/dev/null
          jq -n --slurpfile seed "$SEED" --arg url "$LOGIN_URL" '
            def from_env($prefix; $secret):
              $ENV | to_entries
              | map(select((.key | startswith($prefix)) and .value != ""))
              | map({ key: (.key | ltrimstr($prefix) | ascii_downcase),
                      value: { value: .value, secret: $secret } })
              | from_entries;
            ($seed[0] // {})
            + from_env("KANE_VAR_"; false)
            + from_env("KANE_SECRET_"; true)
            | if $url != "" then .login_url.value = $url | .base_url.value = $url else . end
          ' > .testmuai/variables/runtime.json
          echo "Variables available to tests (values not shown):"
          jq -r 'to_entries[] | "  {{\(.key)}}" + (if .value.secret then "  (secret)" else "" end)' \
            .testmuai/variables/runtime.json

      - name: Select this shard's tests
        id: select
        run: |
          set -euo pipefail
          mapfile -t ALL_TESTS < .ci/selected_tests.txt
          TOTAL=${#ALL_TESTS[@]}
          THIS_SHARD=${{ matrix.shard }}
          SELECTED=()
          for i in "${!ALL_TESTS[@]}"; do
            if (( i % SHARD_COUNT == THIS_SHARD )); then
              SELECTED+=("${ALL_TESTS[$i]}")
            fi
          done
          echo "Shard $THIS_SHARD / $SHARD_COUNT: ${#SELECTED[@]} of $TOTAL tests"
          printf '%s\n' "${SELECTED[@]}" > shard_files.txt
          if [ "${#SELECTED[@]}" -eq 0 ]; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          fi

      # kane-cli does not check variables before running, so a missing secret
      # would otherwise surface as a confusing mid-test failure. Names a test
      # binds itself ("save the response as order", a `name:` key in its own
      # front matter) are not required up front.
      - name: Preflight — every {{variable}} has a value
        if: steps.select.outputs.has_tests == 'true'
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            used=$(grep -oE '\{\{ *[A-Za-z_][A-Za-z0-9_]*' "$f" | sed -E 's/\{\{ *//' | sort -u || true)
            for v in $used; do
              jq -e --arg k "$v" 'has($k)' .testmuai/variables/runtime.json > /dev/null && continue
              grep -qiE "\bas +$v\b|^ *$v *:" "$f" && continue
              echo "::error file=$f::{{$v}} has no value. Add it to $VARIABLES_SEED, or map a secret to it as KANE_SECRET_${v^^} in the env of the 'Build run-time variables file' step."
              missing=1
            done
          done < shard_files.txt
          exit "$missing"

      # Failed tests are results, not pipeline errors: they land in the
      # evidence pack, Result.md and the test-results branch, and this step
      # stays green. kane-cli exits non-zero whenever any test fails, so the
      # step only fails when the run never completed (no testrun_done event),
      # which means something is wrong with the pipeline or its setup.
      - name: Run this shard (author + replay, parallel workers)
        if: steps.select.outputs.has_tests == 'true'
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          set -uo pipefail
          mapfile -t SHARD_FILES < shard_files.txt
          kane-cli testrun run "${SHARD_FILES[@]}" \
            --parallel "$PARALLEL_PER_SHARD" \
            --headless \
            --on-failure continue \
            --username "$LT_USERNAME" \
            --access-key "$LT_ACCESS_KEY" \
            --name "bfsi-testmd-shard-${{ matrix.shard }}-run-${{ github.run_id }}" \
            2>&1 | tee testrun.log
          code=${PIPESTATUS[0]}

          done_line=$(grep -E '"type": *"testrun_done"' testrun.log | tail -n 1 || true)
          if [ -z "$done_line" ]; then
            echo "::error::kane-cli testrun did not complete (exit $code). This is a pipeline or setup problem, not a test failure; see the log above."
            [ "$code" -eq 0 ] && code=1
            exit "$code"
          fi

          status=$(jq -r '.overall_status // "unknown"' <<< "$done_line" 2>/dev/null || echo unknown)
          if [ "$status" != "passed" ]; then
            echo "::warning::Shard ${{ matrix.shard }}: overall status '$status'. Failed tests are recorded in the results and evidence; the pipeline does not fail on them."
          fi

      - name: Collect this shard's generated code + evidence
        if: always() && steps.select.outputs.has_tests == 'true'
        run: |
          set -euo pipefail
          mkdir -p shard-output/evidence
          cp .testmuai/evidence/*.evidence shard-output/evidence/ 2>/dev/null || true
          # For each test.md this shard ran, carry over its generated
          # automation code + Result.md (kane-cli writes these next to the
          # source file, prefixed output-<name>[.<env>]/).
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            base="$(basename "$f" _test.md)"
            dir="$(dirname "$f")"
            find "$dir" -maxdepth 1 -type d -name "output-${base}*" -exec cp -r {} shard-output/ \; 2>/dev/null || true
          done < shard_files.txt

      - uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.has_tests == 'true'
        with:
          name: results-shard-${{ matrix.shard }}
          path: shard-output/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Aggregate every shard's generated code + evidence into one artifact,
  #    and write a per-test pass/fail summary straight into the run's job
  #    summary page so results are readable without downloading anything.
  # ---------------------------------------------------------------------------
  aggregate:
    needs: [select-tests, run-tests]
    if: always() && needs.select-tests.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-shard-*
          path: results
          merge-multiple: true

      - name: Publish results summary
        run: |
          set -euo pipefail
          {
            echo "## Kane CLI test run — .testmuai/tests"
            echo ""
            echo "Full generated automation code and evidence packs for every test are attached as the \`all-results\` workflow artifact below, and (once the \`publish-results\` job finishes) browseable at [\`test-results/latest\`](${{ github.server_url }}/${{ github.repository }}/tree/test-results/latest)."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Test failures are reported here, not turned into a failed pipeline.
          PASSED=0; FAILED=0; OTHER=0
          while read -r f; do
            case "$(awk -F': ' '/^status:/{print $2; exit}' "$f")" in
              passed) PASSED=$((PASSED + 1)) ;;
              failed) FAILED=$((FAILED + 1)) ;;
              *)      OTHER=$((OTHER + 1)) ;;
            esac
          done < <(find results -name Result.md 2>/dev/null)
          echo "### Results: ✅ $PASSED passed · ❌ $FAILED failed · ⚠️ $OTHER other" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" -gt 0 ] || [ "$OTHER" -gt 0 ]; then
            echo "::warning::$FAILED failed and $OTHER other test(s). Details are in the job summary and on the test-results branch."
          fi

          if find results -name Result.md 2>/dev/null | grep -q .; then
            find results -name Result.md | sort | while read -r f; do
              name="$(basename "$(dirname "$f")")"
              {
                echo "<details><summary>${name}</summary>"
                echo ""
                cat "$f"
                echo ""
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "_No Result.md files were produced by this run._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: all-results
          path: results
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4. Commit this run's generated code + evidence to a dedicated `test-results`
  #    branch so they're browseable straight from the GitHub UI (no downloading
  #    an artifact zip, no digging through logs). Runs even if a shard hit a
  #    pipeline error, so whatever results exist are still published.
  #
  #    Layout on the test-results branch:
  #      latest/         — this run's results, overwritten every run
  #      runs/<run_id>/  — one folder per run, kept for the most recent 30 runs
  #      README.md       — run history table, regenerated every run
  # ---------------------------------------------------------------------------
  publish-results:
    needs: [select-tests, run-tests]
    if: always() && needs.select-tests.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Download outside the workspace: checkout wipes the workspace, and
      # anything left inside it would be swept into the branch by `git add -A`.
      - uses: actions/download-artifact@v4
        with:
          pattern: results-shard-*
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - name: Build this run's result set
        id: build
        run: |
          set -euo pipefail
          RUN_DIR="run-build"
          rm -rf "$RUN_DIR"
          mkdir -p "$RUN_DIR"
          cp -r "$RUNNER_TEMP/results/." "$RUN_DIR/" 2>/dev/null || true

          {
            echo "# Kane CLI test results — run ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo ""
            echo "- Triggered by: \`${{ github.event_name }}\`"
            echo "- Commit: [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "- Workflow run: [$GITHUB_RUN_ID]( ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} )"
            echo ""
            echo "| Test | Status | Duration | Result |"
            echo "|---|---|---|---|"
          } > "$RUN_DIR/README.md"

          if find "$RUN_DIR" -name Result.md 2>/dev/null | grep -q .; then
            find "$RUN_DIR" -name Result.md | sort | while read -r f; do
              status="$(awk -F': ' '/^status:/{print $2; exit}' "$f")"
              dur="$(awk -F': ' '/^duration_s:/{print $2; exit}' "$f")"
              name="$(basename "$(dirname "$f")")"
              rel="${f#$RUN_DIR/}"
              case "$status" in
                passed) badge="✅ passed" ;;
                failed) badge="❌ failed" ;;
                *) badge="⚠️ ${status:-unknown}" ;;
              esac
              echo "| $name | $badge | ${dur:-?}s | [Result.md]($rel) |" >> "$RUN_DIR/README.md"
            done
          else
            echo "| _none_ | — | — | — |" >> "$RUN_DIR/README.md"
          fi

          PASSED=$(grep -c '✅ passed' "$RUN_DIR/README.md" || true)
          FAILED=$(grep -c '❌ failed' "$RUN_DIR/README.md" || true)
          OTHER=$(grep -c '⚠️' "$RUN_DIR/README.md" || true)

          cat > "$RUN_DIR/meta.json" <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "run_attempt": "${{ github.run_attempt }}",
            "sha": "${{ github.sha }}",
            "event": "${{ github.event_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "passed": $PASSED,
            "failed": $FAILED,
            "other": $OTHER
          }
          EOF

      - name: Publish to test-results branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin test-results 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/test-results; then
            git checkout -B test-results origin/test-results
          else
            git checkout --orphan test-results
            git rm -rf . > /dev/null 2>&1 || true
          fi

          RUN_DIR="runs/${{ github.run_id }}-${{ github.run_attempt }}"
          rm -rf "$RUN_DIR" latest
          mkdir -p "$(dirname "$RUN_DIR")"
          mv run-build "$RUN_DIR"
          cp -r "$RUN_DIR" latest

          # Keep only the most recent 30 run folders so the branch doesn't grow forever.
          mapfile -t OLD_RUNS < <(ls -1 runs | sort -t- -k1,1rn | tail -n +31)
          for old in "${OLD_RUNS[@]:-}"; do
            [ -z "$old" ] && continue
            rm -rf "runs/$old"
          done

          {
            echo "# Kane CLI — BFSI test results"
            echo ""
            echo "[Latest run](./latest/README.md) · Full history below (last 30 runs kept)."
            echo ""
            echo "| Run | When (UTC) | Passed | Failed | Other |"
            echo "|---|---|---|---|---|"
          } > README.md

          for d in $(ls -1 runs | sort -t- -k1,1rn); do
            meta="runs/$d/meta.json"
            [ -f "$meta" ] || continue
            when=$(jq -r '.timestamp' "$meta")
            passed=$(jq -r '.passed' "$meta")
            failed=$(jq -r '.failed' "$meta")
            other=$(jq -r '.other' "$meta")
            echo "| [$d](./runs/$d/README.md) | $when | $passed | $failed | $other |" >> README.md
          done

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish results for run ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            git push origin HEAD:test-results
          fi
